services:
  bot:
    profiles: ["dedicated-bot"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    image: ofeliya-runtime:${OFELIYA_RELEASE:?OFELIYA_RELEASE is required}
    command: ["node", "bot/index.mjs"]
    env_file:
      - ${OFELIYA_BOT_ENV_FILE:-/opt/hub/.env}
      - ${OFELIYA_ENV_FILE:-/opt/ofeliya/.env}
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /app/certs/extra-ca.crt
    volumes:
      - ${OFELIYA_EXTRA_CA_CERT:?OFELIYA_EXTRA_CA_CERT is required}:/app/certs/extra-ca.crt:ro
    restart: unless-stopped
    networks:
      quiz-battle:
        aliases: [ofeliya-bot]

  static:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: static
      args:
        # Strain Zero uses VITE_MAX_BOT_NAME for challenge/share links.
        # Keep the historical alias too for compatibility with shared code.
        VITE_MAX_BOT_NAME: ${OFELIYA_BOT_USERNAME:?OFELIYA_BOT_USERNAME is required; pass --env-file /opt/ofeliya/.env}
        VITE_MAX_BOT_USERNAME: ${OFELIYA_BOT_USERNAME:?OFELIYA_BOT_USERNAME is required; pass --env-file /opt/ofeliya/.env}
        VITE_TG_BOT_USERNAME: ${VITE_TG_BOT_USERNAME:-}
        VITE_DEVELOPER_BRAND: ${OFELIYA_DEVELOPER_BRAND:-ChatBot24}
        VITE_DEVELOPER_LEGAL_NAME: ${OFELIYA_DEVELOPER_LEGAL_NAME:?OFELIYA_DEVELOPER_LEGAL_NAME is required}
        VITE_DEVELOPER_REGISTRATION: ${OFELIYA_DEVELOPER_REGISTRATION:?OFELIYA_DEVELOPER_REGISTRATION is required}
        VITE_DEVELOPER_ADDRESS: ${OFELIYA_DEVELOPER_ADDRESS:?OFELIYA_DEVELOPER_ADDRESS is required}
        VITE_SUPPORT_EMAIL: ${OFELIYA_SUPPORT_EMAIL:?OFELIYA_SUPPORT_EMAIL is required}
        VITE_SUPPORT_PHONE: ${OFELIYA_SUPPORT_PHONE:-}
    image: ofeliya-static:${OFELIYA_RELEASE:?OFELIYA_RELEASE is required}
    restart: unless-stopped
    depends_on:
      score:
        condition: service_healthy
    networks:
      quiz-battle:
        aliases: [ofeliya-static]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  score:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: score
    image: ofeliya-score:${OFELIYA_RELEASE:?OFELIYA_RELEASE is required}
    command:
      - sh
      - -c
      - 'MAX_BOT_TOKEN="$$OFELIYA_BOT_TOKEN" GAME_URL="$$OFELIYA_GAME_URL" exec node server/index.mjs'
    environment:
      NODE_ENV: production
      PORT: 8787
    env_file:
      - ${OFELIYA_BOT_ENV_FILE:-/opt/hub/.env}
      - ${OFELIYA_ENV_FILE:-/opt/ofeliya/.env}
    volumes:
      - ofeliya-score-data:/app/server/data
    restart: unless-stopped
    networks:
      quiz-battle:
        aliases: [ofeliya-score]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  quiz-battle:
    external: true
    name: ${OFELIYA_SHARED_NETWORK:-quiz-battle_default}

volumes:
  ofeliya-score-data:
