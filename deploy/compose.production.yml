services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    image: ofeliya-runtime:${OFELIYA_RELEASE:?OFELIYA_RELEASE is required}
    command: ["node", "bot/index.mjs"]
    env_file: /opt/hub/.env
    environment:
      NODE_ENV: production
      # Never inherit the Hub bot identity from the shared env file. MAX
      # open_app is bound to the bot username, so a Hub fallback opens Hub's
      # Mini App even when the button text says OFELIYA.
      BOT_TOKEN: ${OFELIYA_BOT_TOKEN:?OFELIYA_BOT_TOKEN is required}
      OFELIYA_BOT_USERNAME: ${OFELIYA_BOT_USERNAME:?OFELIYA_BOT_USERNAME is required}
      OFELIYA_BOT_WEBHOOK_DOMAIN: ${OFELIYA_BOT_WEBHOOK_DOMAIN:?OFELIYA_BOT_WEBHOOK_DOMAIN is required}
      OFELIYA_BOT_WEBHOOK_PORT: ${OFELIYA_BOT_WEBHOOK_PORT:-8788}
      OFELIYA_BOT_WEBHOOK_PATH: ${OFELIYA_BOT_WEBHOOK_PATH:-/ofeliya/bot/webhook}
      OFELIYA_BOT_WEBHOOK_SECRET: ${OFELIYA_BOT_WEBHOOK_SECRET:?OFELIYA_BOT_WEBHOOK_SECRET is required}
      NODE_EXTRA_CA_CERTS: /app/certs/extra-ca.crt
    volumes:
      - ${HUB_EXTRA_CA_CERT:?HUB_EXTRA_CA_CERT is required}:/app/certs/extra-ca.crt:ro
    restart: unless-stopped
    networks:
      quiz-battle:
        aliases: [ofeliya-bot]

  static:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: static
      args:
        # Keep client deep-links bound to the same Ofeliya bot as open_app.
        VITE_MAX_BOT_USERNAME: ${OFELIYA_BOT_USERNAME:?OFELIYA_BOT_USERNAME is required}
        VITE_TG_BOT_USERNAME: ${VITE_TG_BOT_USERNAME:-}
    image: ofeliya-static:${OFELIYA_RELEASE:?OFELIYA_RELEASE is required}
    restart: unless-stopped
    depends_on:
      score:
        condition: service_healthy
    networks:
      quiz-battle:
        aliases: [ofeliya-static]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # v0.4.x: score/leaderboard API (server/index.mjs, zero-dep). nginx
  # проксирует /api/* сюда (deploy/nginx.conf).
  score:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: score
    image: ofeliya-score:${OFELIYA_RELEASE:?OFELIYA_RELEASE is required}
    command: ["node", "server/index.mjs"]
    environment:
      NODE_ENV: production
      PORT: 8787
      # Explicitly override server/index.mjs's historical BOT_TOKEN fallback so
      # MAX initData is verified with the Ofeliya bot, never the Hub bot.
      MAX_BOT_TOKEN: ${OFELIYA_BOT_TOKEN:?OFELIYA_BOT_TOKEN is required}
      GAME_URL: ${OFELIYA_GAME_URL:-}
    env_file: /opt/hub/.env
    volumes:
      - ofeliya-score-data:/app/server/data
    restart: unless-stopped
    networks:
      quiz-battle:
        aliases: [ofeliya-score]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  quiz-battle:
    external: true
    name: ${HUB_SHARED_NETWORK:-quiz-battle_default}

volumes:
  ofeliya-score-data:
