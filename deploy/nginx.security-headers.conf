# Shared messenger browser security policy. Keep origins explicit: MAX Bridge + Telegram WebApp SDK/Web.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://st.max.ru https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://st.max.ru https://telegram.org; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://*.max.ru https://web.max.ru https://web.telegram.org" always;
