worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      include /etc/nginx/ofeliya-security-headers.conf;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location = /api/ref {
      include /etc/nginx/ofeliya-security-headers.conf;
      limit_except GET { deny all; }
      proxy_ssl_server_name on;
      proxy_ssl_name ofeliya.freeveol.dpdns.org;
      proxy_set_header Host ofeliya.freeveol.dpdns.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass https://ofeliya.freeveol.dpdns.org/ofeliya/api/ref;
    }

    location /api/ {
      include /etc/nginx/ofeliya-security-headers.conf;
      proxy_ssl_server_name on;
      proxy_ssl_name ofeliya.freeveol.dpdns.org;
      proxy_set_header Host ofeliya.freeveol.dpdns.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass https://ofeliya.freeveol.dpdns.org/ofeliya/api/;
    }

    location = /runtime-config.js {
      include /etc/nginx/ofeliya-security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files $uri =404;
    }

    location /assets/ {
      include /etc/nginx/ofeliya-security-headers.conf;
      add_header Cache-Control 'public, max-age=31536000, immutable' always;
      try_files $uri =404;
    }

    location = /index.html {
      include /etc/nginx/ofeliya-security-headers.conf;
      add_header Cache-Control 'no-cache, must-revalidate' always;
      try_files $uri =404;
    }

    location = /ofeliya {
      include /etc/nginx/ofeliya-security-headers.conf;
      return 308 /ofeliya/;
    }

    location ^~ /ofeliya/api/ {
      include /etc/nginx/ofeliya-security-headers.conf;
      proxy_ssl_server_name on;
      proxy_ssl_name ofeliya.freeveol.dpdns.org;
      proxy_set_header Host ofeliya.freeveol.dpdns.org;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass https://ofeliya.freeveol.dpdns.org/ofeliya/api/;
    }

    location = /ofeliya/runtime-config.js {
      include /etc/nginx/ofeliya-security-headers.conf;
      rewrite ^/ofeliya/(.*)$ /$1 break;
      add_header Cache-Control 'no-store' always;
      try_files $uri =404;
    }

    location /ofeliya/assets/ {
      include /etc/nginx/ofeliya-security-headers.conf;
      rewrite ^/ofeliya/(.*)$ /$1 break;
      add_header Cache-Control 'public, max-age=31536000, immutable' always;
      try_files $uri =404;
    }

    location /ofeliya/ {
      include /etc/nginx/ofeliya-security-headers.conf;
      rewrite ^/ofeliya/(.*)$ /$1 break;
      add_header Cache-Control 'no-cache, must-revalidate' always;
      try_files $uri $uri/ /index.html;
    }

    location / {
      include /etc/nginx/ofeliya-security-headers.conf;
      add_header Cache-Control 'no-cache, must-revalidate' always;
      try_files $uri $uri/ /index.html;
    }
  }
}
