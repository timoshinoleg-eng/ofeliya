worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /runtime-config.js {
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    # Legacy write endpoint is unauthenticated in the historical score-server.
    # Current clients persist referrals only through authenticated /api/score,
    # so production blocks POST /api/ref while keeping GET for read-only stats.
    location = /api/ref {
      limit_except GET {
        deny all;
      }
      proxy_pass http://ofeliya-score:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # v0.4.x: score/season/daily/friends/VK-verified API (server/index.mjs).
    location /api/ {
      proxy_pass http://ofeliya-score:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri =404;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
