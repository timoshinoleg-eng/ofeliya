name: Release smoke

on:
  push:
    branches:
      - feat/visual-engagement-sprint-v1

permissions:
  contents: write

jobs:
  smoke:
    if: ${{ contains(github.event.head_commit.message, '[release-smoke]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-engagement-sprint-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clarify result record label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/scenes/UIScene.ts')
          text = path.read_text()
          old = "if (res.records.timeRecord && res.timeMs > 0) rec.push('сеанс');"
          new = "if (res.records.timeRecord && res.timeMs > 0) rec.push(res.win ? 'победа' : 'выживание');"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/scenes/UIScene.ts
            git commit -m 'fix: label survival and victory records explicitly'
            git push origin HEAD:feat/visual-engagement-sprint-v1
          fi

      - name: Install project
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install transient browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Start Vite dev server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/ofeliya-vite.log 2>&1 &
          echo $! > /tmp/ofeliya-vite.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/ofeliya-vite.log
          exit 1

      - name: Mobile lifecycle and combat smoke
        env:
          CI: 'true'
        run: |
          cat > /tmp/release-smoke.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          function assert(ok, message) {
            if (!ok) throw new Error(message);
          }

          const chromeCandidates = [
            '/usr/bin/google-chrome-stable',
            '/usr/bin/google-chrome',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ];
          const executablePath = chromeCandidates.find((p) => fs.existsSync(p));
          if (!executablePath) throw new Error('No system Chrome/Chromium found');

          async function listenerCount(page) {
            return page.evaluate(() => {
              const scale = window.__game.scale;
              if (typeof scale.listenerCount === 'function') return scale.listenerCount('resize');
              if (typeof scale.listeners === 'function') return scale.listeners('resize').length;
              return -1;
            });
          }

          async function runViewport(browser, viewport, muted) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
            await context.route('https://st.max.ru/**', (route) => route.abort());
            await context.addInitScript(({ muted }) => {
              try {
                localStorage.setItem('ofeliya_save_v1', JSON.stringify({ muted }));
              } catch {}
              window.__maxBack = { shown: 0, hidden: 0, handler: null };
              window.WebApp = {
                platform: 'android',
                version: 'smoke',
                initData: 'signed-smoke-payload',
                initDataUnsafe: {
                  user: { id: 42, first_name: 'Тест', last_name: 'MAX', username: 'test_max' },
                },
                getViewportSize: async () => ({
                  width: String(window.innerWidth),
                  height: String(window.innerHeight),
                }),
                shareContent: async () => ({}),
                BackButton: {
                  show() { window.__maxBack.shown += 1; },
                  hide() { window.__maxBack.hidden += 1; },
                  onClick(cb) { window.__maxBack.handler = cb; },
                  offClick(cb) { if (window.__maxBack.handler === cb) window.__maxBack.handler = null; },
                },
                HapticFeedback: {
                  impactOccurred() {},
                  notificationOccurred() {},
                },
              };
            }, { muted });

            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', (err) => pageErrors.push(String(err)));

            await page.goto('http://127.0.0.1:5173/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => window.__game && window.__game.scene.isActive('Menu'), null, { timeout: 15000 });

            const menu = await page.evaluate(() => {
              const g = window.__game;
              const s = g.scene.getScene('Menu');
              const texts = s.children.list.filter((o) => o && typeof o.text === 'string').map((o) => o.text);
              return {
                width: g.scale.width,
                height: g.scale.height,
                greeting: texts.some((t) => t.includes('Привет, Тест MAX!')),
                canvasW: g.canvas.clientWidth,
                canvasH: g.canvas.clientHeight,
                backHidden: window.__maxBack.hidden,
              };
            });
            assert(menu.greeting, `MAX first_name/last_name greeting missing at ${viewport.width}x${viewport.height}`);
            assert(menu.width === viewport.width && menu.height === viewport.height, `Phaser scale mismatch: ${JSON.stringify(menu)}`);
            assert(menu.canvasW === viewport.width && menu.canvasH === viewport.height, `Canvas CSS size mismatch: ${JSON.stringify(menu)}`);
            assert(menu.backHidden >= 1, 'MAX BackButton was not hidden on Menu');

            await page.evaluate(() => window.__game.scene.getScene('Menu').scene.start('Game'));
            await page.waitForFunction(() => window.__game.scene.isActive('Game') && window.__game.scene.isActive('UI'));
            const listenersBefore = await listenerCount(page);
            assert(listenersBefore >= 1, `Could not inspect resize listener baseline: ${listenersBefore}`);

            for (let i = 0; i < 10; i++) {
              await page.evaluate(() => window.__game.scene.getScene('Game').scene.restart());
              await page.waitForTimeout(80);
              await page.waitForFunction(() => window.__game.scene.isActive('Game'));
            }
            const listenersAfter = await listenerCount(page);
            assert(listenersAfter === listenersBefore, `resize listeners leaked: ${listenersBefore} -> ${listenersAfter}`);

            await page.evaluate(() => {
              const gs = window.__game.scene.getScene('Game');
              gs.onGemCollected(gs.runState.xpNext + 1);
            });
            await page.waitForFunction(() => window.__game.scene.getScene('UI').modalOpen === true, null, { timeout: 5000 });
            const levelBounds = await page.evaluate(() => {
              const ui = window.__game.scene.getScene('UI');
              const b = ui.modal.getBounds();
              return { x: b.x, y: b.y, right: b.right, bottom: b.bottom, width: window.__game.scale.width, height: window.__game.scale.height };
            });
            assert(levelBounds.x >= -2 && levelBounds.y >= -2 && levelBounds.right <= levelBounds.width + 2 && levelBounds.bottom <= levelBounds.height + 2,
              `Level-up overflow: ${JSON.stringify(levelBounds)}`);
            await page.evaluate(() => {
              const g = window.__game;
              const ui = g.scene.getScene('UI');
              const gs = g.scene.getScene('Game');
              ui.hideModal();
              gs.awaitingChoice = false;
              gs.pendingChoices = [];
              ui.scene.resume('Game');
            });

            await page.evaluate(() => {
              const gs = window.__game.scene.getScene('Game');
              gs.runState.stacks.dmg = 3;
              gs.runState.stacks.pierce = 2;
              gs.onGemCollected(gs.runState.xpNext + 1);
            });
            await page.waitForFunction(() => {
              const gs = window.__game.scene.getScene('Game');
              return gs.awaitingChoice && gs.pendingChoices.some((x) => x.id === 'evo:prism');
            }, null, { timeout: 5000 });
            await page.waitForFunction(() => window.__game.scene.getScene('UI').modalOpen === true);
            const evoRendered = await page.evaluate(() => {
              const g = window.__game;
              const gs = g.scene.getScene('Game');
              const ui = g.scene.getScene('UI');
              const more = gs.chooseUpgrade('evo:prism');
              const id = gs.consumeEvolutionCeremony();
              ui.hideModal();
              if (!id) return false;
              ui.showEvolutionCeremony(id, more);
              return gs.runState.hasEvolution('prism');
            });
            assert(evoRendered, 'PRISM evolution was not applied/rendered');
            await page.waitForFunction(() => {
              const ui = window.__game.scene.getScene('UI');
              return ui.children.list.some((o) => o && o.text === 'ПРИЗМА');
            });
            await page.waitForTimeout(1450);

            const density = await page.evaluate(() => {
              const gs = window.__game.scene.getScene('Game');
              gs.runState.maxHp = 1e9;
              gs.runState.hp = 1e9;
              for (let i = 0; i < 150; i++) {
                const a = (i / 150) * Math.PI * 2;
                const r = 330 + (i % 5) * 24;
                gs.spawnEnemy('swarm', gs.player.x + Math.cos(a) * r, gs.player.y + Math.sin(a) * r, false);
              }
              return gs.enemies.countActive(true);
            });
            assert(density >= 140, `Dense combat setup too small: ${density}`);
            await page.waitForTimeout(700);

            const boss = await page.evaluate(() => {
              const gs = window.__game.scene.getScene('Game');
              gs.runState.timeMs = 300001;
              gs.wave.update(16);
              return gs.wave.boss ? { hp: gs.wave.boss.hp, maxHp: gs.wave.boss.maxHp } : null;
            });
            assert(boss && boss.maxHp > 0, `Boss did not spawn at 5:00: ${JSON.stringify(boss)}`);

            await page.evaluate(() => window.__game.scene.getScene('Game').finish(false));
            await page.waitForFunction(() => window.__game.scene.getScene('UI').overShown === true);
            const retry = await page.evaluate(() => {
              const ui = window.__game.scene.getScene('UI');
              const t = ui.children.list.find((o) => o && o.text === 'ЕЩЁ РАЗ');
              return t ? { x: t.x, y: t.y, visible: t.visible } : null;
            });
            assert(retry && retry.visible, 'Primary retry control missing');
            await page.mouse.click(retry.x, retry.y);
            await page.waitForFunction(() => {
              const g = window.__game;
              const gs = g.scene.getScene('Game');
              const ui = g.scene.getScene('UI');
              return g.scene.isActive('Game') && gs.runState && gs.runState.timeMs < 1500 && ui.overShown === false;
            }, null, { timeout: 5000 });

            const listenersFinal = await listenerCount(page);
            assert(listenersFinal === listenersBefore, `listeners changed after result restart: ${listenersBefore} -> ${listenersFinal}`);
            assert(pageErrors.length === 0, `Page errors: ${pageErrors.join('\n')}`);

            console.log(JSON.stringify({ viewport, muted, listenersBefore, listenersAfter, listenersFinal, density, boss, status: 'ok' }));
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            try {
              await runViewport(browser, { width: 390, height: 844 }, false);
              await runViewport(browser, { width: 430, height: 932 }, true);
            } finally {
              await browser.close();
            }
          })().catch((err) => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/release-smoke.cjs

      - name: Dump Vite log on failure
        if: failure()
        run: cat /tmp/ofeliya-vite.log || true
