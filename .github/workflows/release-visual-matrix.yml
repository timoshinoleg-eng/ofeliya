name: Release Visual Matrix

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  visual-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/ofeliya-preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .5
          done
          cat /tmp/ofeliya-preview.log
          exit 1

      - name: Run 12-case visual release matrix
        env:
          OFELIYA_BASE_URL: http://127.0.0.1:4173/
          OFELIYA_MATRIX_DIR: /tmp/release-visual-matrix
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: npm run test:visual-matrix

      - name: Upload release visual matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-visual-matrix
          path: /tmp/release-visual-matrix/
          if-no-files-found: warn
