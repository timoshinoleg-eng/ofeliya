name: Release Visual Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/release-visual-matrix.cjs'
      - '.github/workflows/release-visual-matrix.yml'
      - 'src/game/config.ts'
      - 'src/systems/PerformanceProfile.ts'
  push:
    tags:
      - 'v*'

jobs:
  visual-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production QA bundle
        env:
          VITE_RELEASE_MATRIX_QA: '1'
          # scripts/stamp-release.mjs refuses to stamp a build without an explicit
          # 40-character release SHA; reuse the same source as the CI build gate.
          VITE_RELEASE_SHA: ${{ github.sha }}
        run: npm run build

      - name: Install browser driver and image metrics
        run: npm install --no-save --package-lock=false playwright-core@1.55.0 pngjs@7.0.0

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/ofeliya-preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .5
          done
          cat /tmp/ofeliya-preview.log
          exit 1

      - name: Run 12-case visual release matrix
        env:
          OFELIYA_BASE_URL: http://127.0.0.1:4173/
          OFELIYA_MATRIX_DIR: /tmp/release-visual-matrix
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: npm run test:visual-matrix

      - name: Upload release visual matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-visual-matrix
          path: /tmp/release-visual-matrix/
          if-no-files-found: warn

  # Campaign release gate (§6.1 of the harness design).
  #
  # DECISION (track D): a separate job, NOT an extension of visual-matrix.
  # - Different builds: the gate needs a clean production build first
  #   (harness-absent + bundle-shape inspect dist/), then a QA build with
  #   BOTH VITE_QA_TOOLS=1 (harness API) and VITE_RELEASE_MATRIX_QA=1
  #   (window.__game on preview) for the campaign runs (§4.1). Folding
  #   that into visual-matrix would change its bundle and overwrite dist
  #   mid-job.
  # - Different budget: two full campaigns need ~60 min; visual-matrix
  #   has a 20 min timeout.
  # - The workflow is paths-filtered on pull_request (release-visual-matrix
  #   paths only). This job runs on tag pushes and manual dispatch only
  #   (see `if:` below), so PRs touching config.ts do not pay for two
  #   campaigns. The paths filter itself is NOT removed here — that is a
  #   separate owner decision (PR pending since 2026-11-07).
  # - The §6.1 server suites (server:test, test:server-policy,
  #   test:score-outbox, test:telegram-runtime) are intentionally NOT
  #   repeated here: they already run in ci.yml production-contract on
  #   every PR and push to main.
  campaign-release-gate:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install campaign driver and image metrics
        run: npm install --no-save --package-lock=false playwright-core@1.55.0 pngjs@7.0.0

      # Clean production build first: the harness-absent gate inspects
      # dist/, so it must run after this build, not before it.
      - name: Build production bundle (clean environment)
        run: env -u VITE_QA_TOOLS -u VITE_RELEASE_MATRIX_QA VITE_RELEASE_SHA=${{ github.sha }} npm run build

      - name: Harness API absent from production bundle
        run: npm run test:harness-absent

      - name: Production bundle shape
        run: npm run test:bundle-shape

      - name: Build QA bundle for preview
        env:
          VITE_QA_TOOLS: '1'
          VITE_RELEASE_MATRIX_QA: '1'
          VITE_RELEASE_SHA: ${{ github.sha }}
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/ofeliya-preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .5
          done
          cat /tmp/ofeliya-preview.log
          exit 1

      - name: Campaign release gate (Standard)
        env:
          OFELIYA_BASE_URL: http://127.0.0.1:4173/
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" npm run test:campaign -- --seed release-standard --difficulty standard

      - name: Campaign release gate (Strained)
        env:
          OFELIYA_BASE_URL: http://127.0.0.1:4173/
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" npm run test:campaign -- --seed release-strained --difficulty strained

      - name: Build campaign HTML report
        if: always()
        run: |
          if [ -d artifacts/autonomous-campaign ]; then
            node scripts/lib/campaign-report.cjs --input artifacts/autonomous-campaign --out artifacts/campaign
          else
            echo "no campaign artifacts to report"
          fi

      - name: Upload release campaign artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-campaign-release
          path: |
            artifacts/autonomous-campaign/
            artifacts/campaign/
          retention-days: 90
          if-no-files-found: ignore
