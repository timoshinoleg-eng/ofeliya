name: Fix release smoke path

on:
  push:
    branches:
      - feat/visual-engagement-sprint-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[release-smoke]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-engagement-sprint-v1
      - name: Fix NODE_PATH and retrigger smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release-smoke.yml')
          s = p.read_text()
          old = '          node /tmp/release-smoke.cjs'
          new = '          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/release-smoke.cjs'
          if old not in s:
              raise SystemExit('smoke runner line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-smoke.yml
          git commit -m 'test: fix release smoke module resolution [release-smoke]'
          git push origin HEAD:feat/visual-engagement-sprint-v1
