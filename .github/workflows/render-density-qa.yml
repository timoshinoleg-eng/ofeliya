name: Render Density QA Experiment
on:
  pull_request:
    paths:
      - 'src/systems/RenderDensityExperiment.ts'
      - 'src/main.ts'
      - 'scripts/render-density-*.cjs'
      - '.github/workflows/render-density-qa.yml'
jobs:
  density-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated development fixture
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/density-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/density-vite.log
          exit 1
      - name: Actual framebuffer DPR, viewport, input, resume and teardown
        env:
          OFELIYA_URL: http://127.0.0.1:5173/
          OFELIYA_ARTIFACTS: artifacts/density-smoke
        run: node scripts/render-density-smoke.cjs
      - name: Paired dense raster, real pointer and quality fallback
        env:
          OFELIYA_BASE_URL: http://127.0.0.1:5173/
          OFELIYA_DENSITY_DIR: artifacts/density-pairs
        run: node scripts/render-density-paired-proof.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-density-qa
          path: artifacts/
          if-no-files-found: warn
