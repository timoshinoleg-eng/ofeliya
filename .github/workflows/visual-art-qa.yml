name: Strain Zero visual art QA

on:
  push:
    branches: [feat/strain-zero-redesign]

jobs:
  capture:
    if: ${{ contains(github.event.head_commit.message, '[visual-qa]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/vite.log
          exit 1
      - name: Capture final visual states
        run: |
          mkdir -p /tmp/art
          cat > /tmp/capture.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const chrome = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          if (!chrome) throw new Error('Chrome not found');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            const browser = await chromium.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const ctx = await browser.newContext({viewport:{width:390,height:844}, deviceScaleFactor:1});
            await ctx.route('https://st.max.ru/**', route => route.fulfill({status:200,contentType:'application/javascript',body:''}));
            await ctx.addInitScript(() => localStorage.setItem('ofeliya_save_v1', JSON.stringify({muted:true,runs:0})));
            const page = await ctx.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:5173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__game?.scene.isActive('Menu'));
            await sleep(450);
            await page.screenshot({path:'/tmp/art/01-menu.png'});

            await page.evaluate(()=>window.__game.scene.getScene('Menu').scene.start('Game'));
            await page.waitForFunction(()=>window.__game.scene.isActive('Game') && window.__game.scene.isActive('UI'));
            await sleep(800);
            await page.screenshot({path:'/tmp/art/02-opening-combat.png'});

            await page.waitForFunction(()=>window.__game.scene.getScene('Game').awaitingChoice === true, null, {timeout:10000});
            await sleep(220);
            const tutorialState = await page.evaluate(()=>{
              const gs=window.__game.scene.getScene('Game');
              const leakedText=gs.children.list.some(o=>o?.active && typeof o.text==='string' && o.text.includes('ТЫ ВНУТРИ КРОВОТОКА'));
              return { refGone: gs.introHint === null || !gs.introHint?.active, leakedText };
            });
            if(!tutorialState.refGone || tutorialState.leakedText) throw new Error('first-run tutorial survived under mutation modal: '+JSON.stringify(tutorialState));
            await page.screenshot({path:'/tmp/art/03-first-mutation.png'});

            await page.evaluate(()=>{
              const g=window.__game, gs=g.scene.getScene('Game'), ui=g.scene.getScene('UI');
              const choice=gs.pendingChoices?.[0];
              if (choice) gs.chooseUpgrade(choice.id);
              ui.hideModal();
              g.scene.resume('Game');
              gs.finished=true;
              gs.physics.world.pause();
              for(const e of gs.enemies.getChildren()) if(e?.active) e.disableBody(true,true);
              gs.player.setMutationState(true,true,true);
              const kinds=[['swarm',-92,-78],['runner',104,-58],['brute',-100,86],['boss',100,94]];
              for(const [kind,dx,dy] of kinds){
                const x=gs.player.x+dx, y=gs.player.y+dy;
                const e=gs.enemies.get(x,y);
                if(e) e.activate(gs,kind,x,y,{elite:false,hpScale:1,dmgScale:1});
              }
            });
            await sleep(220);
            await page.screenshot({path:'/tmp/art/04-immune-cast-and-critical-virus.png'});

            await page.evaluate(()=>{
              const gs=window.__game.scene.getScene('Game');
              for(const e of gs.enemies.getChildren()) if(e?.active) e.disableBody(true,true);
              gs.player.setMutationState(false,false,false);
              const hs=gs.hostCells;
              hs.spawnNearPlayer();
              const cell=hs.cells.find(c=>c.active);
              if(!cell) throw new Error('host cell slot unavailable');
              cell.image.setPosition(gs.player.x,gs.player.y+112);
              cell.infectionOverlay.setPosition(cell.image.x,cell.image.y);
              cell.infection=0.82;
              hs.update(performance.now(),16,10000);
              window.__visualCell=cell;
            });
            await sleep(120);
            await page.screenshot({path:'/tmp/art/05-host-cell-infected.png'});

            await page.evaluate(()=>{
              const gs=window.__game.scene.getScene('Game');
              gs.hostCells.lyse(window.__visualCell);
            });
            await sleep(110);
            await page.screenshot({path:'/tmp/art/06-host-cell-lysis.png'});

            await page.evaluate(()=>{
              const ui=window.__game.scene.getScene('UI');
              ui.hideModal();
              ui.showEvolutionCeremony('prism',false);
            });
            await sleep(260);
            await page.screenshot({path:'/tmp/art/07-critical-mutation-ceremony.png'});

            if(errors.length) throw new Error('page errors: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: strain-zero-art-qa-v6
          path: /tmp/art/*.png
          if-no-files-found: error
