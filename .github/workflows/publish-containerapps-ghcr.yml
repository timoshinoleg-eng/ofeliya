name: Publish Container Apps image to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'deploy/Dockerfile.containerapps'
      - 'deploy/nginx.containerapps.conf'
      - '.github/workflows/publish-containerapps-ghcr.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/timoshinoleg-eng/ofeliya-containerapps

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.containerapps
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VITE_MAX_BOT_NAME=id402806822924_1_bot
            VITE_MAX_BOT_USERNAME=id402806822924_1_bot
            VITE_DEVELOPER_BRAND=ChatBot24
            VITE_DEVELOPER_LEGAL_NAME=ChatBot24
            VITE_DEVELOPER_REGISTRATION=ИП
            VITE_DEVELOPER_ADDRESS=г. Москва
            VITE_SUPPORT_EMAIL=info@chatbot24.su
            VITE_SUPPORT_PHONE=+7 (993) 336-61-02

      - name: Verify anonymous pull
        shell: bash
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io || true
          docker pull "${IMAGE}:sha-${GITHUB_SHA}"
          docker image inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{.Id}}'
