name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Challenge contract smoke
        run: npm run test:challenge

      - name: Viewport math smoke
        run: npm run test:viewport

      - name: MAX release config gate smoke
        env:
          VITE_MAX_BOT_NAME: ofeliya_ci_bot
          VITE_DEVELOPER_LEGAL_NAME: CI Test Developer
          VITE_DEVELOPER_REGISTRATION: CI-REG-1
          VITE_DEVELOPER_ADDRESS: CI Test Address
          VITE_SUPPORT_EMAIL: qa@example.test
        run: npm run release:check

      - name: Typecheck and build
        run: npm run build

  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser smoke driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Start configured dev server
        env:
          VITE_MAX_BOT_NAME: ofeliya_ci_bot
          VITE_DEVELOPER_LEGAL_NAME: CI Test Developer
          VITE_DEVELOPER_REGISTRATION: CI-REG-1
          VITE_DEVELOPER_ADDRESS: CI Test Address
          VITE_SUPPORT_EMAIL: qa@example.test
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/vite.log
          exit 1

      - name: MAX viewport challenge and legal browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/browser-smoke.cjs

      - name: Upload browser smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-browser-smoke
          path: /tmp/browser-smoke/*.png
          if-no-files-found: ignore

  production-contract:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Score server tests
        run: npm run server:test

      - name: MAX bot smoke
        run: npm run smoke:bot

      - name: Strain Zero production release contract
        run: node scripts/check-max-rc-production.mjs

      - name: Validate production compose config
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/ofeliya
          printf '%s\n' \
            'OFELIYA_BOT_TOKEN=ci-placeholder-token' \
            'OFELIYA_BOT_USERNAME=id100000000000_ci_bot' \
            'OFELIYA_BOT_WEBHOOK_DOMAIN=https://example.test' \
            'OFELIYA_BOT_WEBHOOK_PORT=8788' \
            'OFELIYA_BOT_WEBHOOK_PATH=/ofeliya/bot/webhook' \
            'OFELIYA_BOT_WEBHOOK_SECRET=0123456789abcdef0123456789abcdef' \
            'OFELIYA_GAME_URL=https://example.test/ofeliya/' \
            'OFELIYA_DEVELOPER_BRAND=ChatBot24' \
            'OFELIYA_DEVELOPER_LEGAL_NAME=CI Test Developer' \
            'OFELIYA_DEVELOPER_REGISTRATION=CI-REG-1' \
            'OFELIYA_DEVELOPER_ADDRESS=CI Test Address' \
            'OFELIYA_SUPPORT_EMAIL=qa@example.test' \
            | sudo tee /opt/ofeliya/.env >/dev/null
          touch /tmp/ofeliya-ci-extra-ca.crt
          OFELIYA_RELEASE=strain-zero-ci \
          HUB_EXTRA_CA_CERT=/tmp/ofeliya-ci-extra-ca.crt \
          HUB_SHARED_NETWORK=ofeliya-ci \
            docker compose --env-file /opt/ofeliya/.env -f deploy/compose.production.yml config >/tmp/ofeliya-compose.yml
          grep -q 'ofeliya-runtime:strain-zero-ci' /tmp/ofeliya-compose.yml
          grep -q 'ofeliya-static:strain-zero-ci' /tmp/ofeliya-compose.yml
          grep -q 'ofeliya-score:strain-zero-ci' /tmp/ofeliya-compose.yml
          grep -q 'VITE_MAX_BOT_NAME: id100000000000_ci_bot' /tmp/ofeliya-compose.yml
          grep -q 'VITE_DEVELOPER_LEGAL_NAME: CI Test Developer' /tmp/ofeliya-compose.yml

      - name: Build production bot image
        run: docker build -f deploy/Dockerfile --target runtime -t ofeliya-runtime:strain-zero-ci .

      - name: Build production score image
        run: docker build -f deploy/Dockerfile --target score -t ofeliya-score:strain-zero-ci .

      - name: Build production static image
        run: |
          docker build -f deploy/Dockerfile --target static \
            --build-arg VITE_MAX_BOT_NAME=id100000000000_ci_bot \
            --build-arg VITE_MAX_BOT_USERNAME=id100000000000_ci_bot \
            --build-arg VITE_DEVELOPER_BRAND=ChatBot24 \
            --build-arg 'VITE_DEVELOPER_LEGAL_NAME=CI Test Developer' \
            --build-arg VITE_DEVELOPER_REGISTRATION=CI-REG-1 \
            --build-arg 'VITE_DEVELOPER_ADDRESS=CI Test Address' \
            --build-arg VITE_SUPPORT_EMAIL=qa@example.test \
            -t ofeliya-static:strain-zero-ci .

      - name: Validate nginx config
        run: docker run --rm --add-host ofeliya-score:127.0.0.1 ofeliya-static:strain-zero-ci nginx -t -c /etc/nginx/nginx.conf
