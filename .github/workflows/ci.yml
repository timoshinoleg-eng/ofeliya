name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Challenge v1/v2 compatibility smoke
        run: npm run test:challenge

      - name: Fixed-seed duel contract smoke
        run: npm run test:duel

      - name: Save migration compatibility smoke
        run: npm run test:save

      - name: Stage runtime contract smoke
        run: npm run test:stages

      - name: Legendary system deterministic smoke
        run: npm run test:legendary

      - name: Difficulty deterministic smoke
        run: npm run test:difficulty

      - name: Campaign pacing deterministic smoke
        run: npm run test:pacing

      - name: Adaptive audio deterministic smoke
        run: npm run test:audio

      - name: Telegram share contract smoke
        run: npm run test:telegram-share

      - name: Telegram runtime contract smoke
        run: npm run test:telegram-runtime

      - name: Social client contract smoke
        run: npm run test:social

      - name: Analytics client contract smoke
        run: npm run test:analytics

      - name: Daily V2 client contract smoke
        run: npm run test:daily-v2

      - name: Daily CTA atomicity contract
        run: npm run test:daily-cta

      - name: Profile client contract smoke
        run: npm run test:profile

      - name: Founder badge horizontal contract
        run: npm run test:founder-badge

      - name: Player language contract smoke
        run: npm run test:language

      - name: Gameplay RNG deterministic smoke
        run: npm run test:rng

      - name: Viewport math smoke
        run: npm run test:viewport

      - name: UI token contract
        run: npm run test:tokens

      - name: Startup renderer contract
        run: node tests/startup-renderer-contract.mjs

      - name: MAX release config gate smoke
        env:
          VITE_MAX_BOT_NAME: ofeliya_ci_bot
          VITE_DEVELOPER_LEGAL_NAME: CI Test Developer
          VITE_DEVELOPER_REGISTRATION: CI-REG-1
          VITE_DEVELOPER_ADDRESS: CI Test Address
          VITE_SUPPORT_EMAIL: qa@example.test
        run: npm run release:check

      - name: Typecheck and build
        run: npm run build

  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser smoke driver and image metrics
        run: npm install --no-save --package-lock=false playwright-core@1.55.0 pngjs@7.0.0

      - name: Start configured dev server
        env:
          VITE_MAX_BOT_NAME: ofeliya_ci_bot
          VITE_DEVELOPER_LEGAL_NAME: CI Test Developer
          VITE_DEVELOPER_REGISTRATION: CI-REG-1
          VITE_DEVELOPER_ADDRESS: CI Test Address
          VITE_SUPPORT_EMAIL: qa@example.test
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/vite.log
          exit 1

      - name: Music bed browser decode smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/music-bed-browser-smoke.cjs

      - name: Stalled MAX viewport startup smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/startup-viewport-smoke.cjs

      - name: Telegram bridge runtime browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/telegram-runtime-smoke.cjs

      - name: MAX viewport challenge and legal browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/browser-smoke.cjs

      - name: Real-touch result actions smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/result-actions-smoke.cjs

      - name: Real-touch pause smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/pause-smoke.cjs

      - name: Video interstitial fail-safe smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/video-interstitial-smoke.cjs

      - name: Codex and mastery browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/codex-smoke.cjs

      - name: Social hub browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" npm run test:social-hub

      - name: Founder badge browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/founder-badge-smoke.cjs

      - name: Daily CTA runtime browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/daily-cta-smoke.cjs

      - name: MAX compact viewport matrix
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/mobile-layout-matrix.cjs

      - name: HUD hierarchy contract
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/hud-hierarchy-smoke.cjs

      - name: High-DPI WebGL and Canvas fallback smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/renderer-smoke.cjs

      - name: Legendary runtime browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/legendary-runtime-smoke.cjs

      - name: Legendary cinematic ceremony browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/legendary-ceremony-smoke.cjs

      - name: Seeded gameplay runtime browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/rng-runtime-smoke.cjs

      - name: Fixed-seed duel runtime browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/duel-runtime-smoke.cjs

      - name: Trusted score client browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/score-client-smoke.cjs

      - name: IMMUNE PRIME vulnerability runtime browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/prime-vulnerability-smoke.cjs

      - name: CARDIAC TITAN line hazard runtime smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" npm run test:cardiac-hazard

      - name: Strained difficulty runtime browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/difficulty-runtime-smoke.cjs

      - name: Elite modifier identity runtime browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/elite-readability-smoke.cjs

      - name: One-hand and twin-stick multitouch browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/control-mode-smoke.cjs

      - name: Dense visual readability browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/visual-readability-smoke.cjs

      - name: Bloodstream to Heart campaign browser smoke
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/stage-transition-smoke.cjs

      - name: Post-Stage-4 visual matrix 390x740
        env:
          OFELIYA_BASE_URL: http://127.0.0.1:5173/
          OFELIYA_MATRIX_WIDTH: "390"
          OFELIYA_MATRIX_HEIGHT: "740"
          OFELIYA_MATRIX_DIR: /tmp/release-visual-matrix/390x740
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/release-visual-matrix.cjs

      - name: Post-Stage-4 visual matrix 360x640
        env:
          OFELIYA_BASE_URL: http://127.0.0.1:5173/
          OFELIYA_MATRIX_WIDTH: "360"
          OFELIYA_MATRIX_HEIGHT: "640"
          OFELIYA_MATRIX_DIR: /tmp/release-visual-matrix/360x640
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node scripts/release-visual-matrix.cjs

      - name: Upload browser smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-browser-smoke
          path: |
            /tmp/browser-smoke/*.png
            /tmp/release-visual-matrix/**/*.png
            /tmp/release-visual-matrix/**/matrix.json
          if-no-files-found: ignore

  production-contract:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Score server tests
        run: npm run server:test

      - name: MAX bot smoke
        run: npm run smoke:bot

      - name: Strain Zero production release contract
        run: node scripts/check-max-rc-production.mjs

      - name: Validate Cloud.ru deployment script
        run: bash -n deploy/deploy-cloudru.sh

      - name: Validate production compose config
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/ofeliya
          printf '%s\n' \
            'OFELIYA_BOT_MODE=dedicated' \
            'OFELIYA_BOT_ENV_FILE=/opt/ofeliya/.env' \
            'OFELIYA_BOT_TOKEN=ci-placeholder-token' \
            'OFELIYA_BOT_USERNAME=id100000000000_ci_bot' \
            'OFELIYA_BOT_WEBHOOK_DOMAIN=https://example.test' \
            'OFELIYA_BOT_WEBHOOK_PORT=8788' \
            'OFELIYA_BOT_WEBHOOK_PATH=/ofeliya/bot/webhook' \
            'OFELIYA_BOT_WEBHOOK_SECRET=0123456789abcdef0123456789abcdef' \
            'OFELIYA_GAME_URL=https://example.test/ofeliya/' \
            'OFELIYA_DEVELOPER_BRAND=ChatBot24' \
            'OFELIYA_DEVELOPER_LEGAL_NAME=CI Test Developer' \
            'OFELIYA_DEVELOPER_REGISTRATION=CI-REG-1' \
            'OFELIYA_DEVELOPER_ADDRESS=CI Test Address' \
            'OFELIYA_SUPPORT_EMAIL=qa@example.test' \
            | sudo tee /opt/ofeliya/.env >/dev/null
          touch /tmp/ofeliya-ci-extra-ca.crt
          OFELIYA_RELEASE=strain-zero-ci \
          OFELIYA_EXTRA_CA_CERT=/tmp/ofeliya-ci-extra-ca.crt \
          OFELIYA_SHARED_NETWORK=ofeliya-ci \
            docker compose --env-file /opt/ofeliya/.env -f deploy/compose.production.yml config >/tmp/ofeliya-shared.yml
          ! grep -q 'ofeliya-runtime:strain-zero-ci' /tmp/ofeliya-shared.yml
          grep -q 'ofeliya-static:strain-zero-ci' /tmp/ofeliya-shared.yml
          grep -q 'ofeliya-score:strain-zero-ci' /tmp/ofeliya-shared.yml
          OFELIYA_RELEASE=strain-zero-ci \
          OFELIYA_EXTRA_CA_CERT=/tmp/ofeliya-ci-extra-ca.crt \
          OFELIYA_SHARED_NETWORK=ofeliya-ci \
            docker compose --profile dedicated-bot --env-file /opt/ofeliya/.env -f deploy/compose.production.yml config >/tmp/ofeliya-dedicated.yml
          grep -q 'ofeliya-runtime:strain-zero-ci' /tmp/ofeliya-dedicated.yml
          grep -q 'VITE_MAX_BOT_NAME: id100000000000_ci_bot' /tmp/ofeliya-dedicated.yml
          grep -q 'VITE_DEVELOPER_LEGAL_NAME: CI Test Developer' /tmp/ofeliya-dedicated.yml

      - name: Build production bot image
        run: docker build -f deploy/Dockerfile --target runtime -t ofeliya-runtime:strain-zero-ci .

      - name: Build production score image
        run: docker build -f deploy/Dockerfile --target score -t ofeliya-score:strain-zero-ci .

      - name: Smoke production score image runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ofeliya-score-ci ofeliya-score:strain-zero-ci
          trap 'docker logs ofeliya-score-ci || true; docker rm -f ofeliya-score-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if docker exec ofeliya-score-ci node -e "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 0.5
          done
          exit 1

      - name: Build production static image
        run: |
          docker build -f deploy/Dockerfile --target static \
            --build-arg VITE_MAX_BOT_NAME=id100000000000_ci_bot \
            --build-arg VITE_MAX_BOT_USERNAME=id100000000000_ci_bot \
            --build-arg VITE_DEVELOPER_BRAND=ChatBot24 \
            --build-arg 'VITE_DEVELOPER_LEGAL_NAME=CI Test Developer' \
            --build-arg VITE_DEVELOPER_REGISTRATION=CI-REG-1 \
            --build-arg 'VITE_DEVELOPER_ADDRESS=CI Test Address' \
            --build-arg VITE_SUPPORT_EMAIL=qa@example.test \
            --build-arg VITE_RELEASE_SHA="$GITHUB_SHA" \
            -t ofeliya-static:strain-zero-ci .

      - name: Validate nginx config
        run: docker run --rm --add-host ofeliya-score:127.0.0.1 ofeliya-static:strain-zero-ci nginx -t -c /etc/nginx/nginx.conf