name: Wire mutation silhouette

on:
  push:
    branches:
      - feat/strain-zero-redesign

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[mutation-shape]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strain-zero-redesign
      - name: Wire critical mutation silhouette and opening RNA reward
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scenes/GameScene.ts')
          s = p.read_text()

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('patch anchor not found: ' + old[:100])
              s = s.replace(old, new, 1)

          rep(
              "    if (e.xpValue > 0) this.spawnGem(e.x, e.y, e.xpValue);",
              "    if (e.xpValue > 0) {\n      // The first readable pickup teaches the mutation loop immediately instead of requiring\n      // five scattered one-XP drops before the player sees the first choice.\n      const value = st.kills === 1 ? Math.max(5, e.xpValue) : e.xpValue;\n      this.spawnGem(e.x, e.y, value);\n    }"
          )
          rep(
              "      if (def.kind === 'evolution' && def.evolutionId) {\n        this.pendingEvolutionCeremony = def.evolutionId;\n        this.atmosphere.pulse(COLORS.gold, 0.3);",
              "      if (def.kind === 'evolution' && def.evolutionId) {\n        this.pendingEvolutionCeremony = def.evolutionId;\n        this.syncPlayerMutationSilhouette();\n        this.atmosphere.pulse(COLORS.gold, 0.3);"
          )
          anchor = "  consumeEvolutionCeremony(): EvolutionId | null {"
          method = """  private syncPlayerMutationSilhouette(): void {\n    const st = this.runState;\n    this.player.setMutationState(\n      st.hasEvolution('prism'),\n      st.hasEvolution('halo'),\n      st.hasEvolution('singularity')\n    );\n  }\n\n"""
          rep(anchor, method + anchor)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scenes/GameScene.ts
          git commit -m 'feat: connect critical mutations to the virion silhouette'
          git push origin HEAD:feat/strain-zero-redesign
