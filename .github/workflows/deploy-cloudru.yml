name: Deploy Cloud.ru production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Full 40-character main commit SHA. Empty = current main.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ofeliya-cloudru-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudru-production
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve immutable release SHA
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --prune origin main
          sha="${REQUESTED_SHA:-}"
          if [[ -z "$sha" ]]; then
            sha="$(git rev-parse origin/main)"
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character SHA" >&2
            exit 2
          fi
          git cat-file -e "${sha}^{commit}"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Refusing deploy: $sha is not contained in origin/main" >&2
            exit 3
          fi
          # Public SHA verification was introduced by this main commit. Older releases do not
          # expose release.json, so accepting them here would deploy first and only then fail smoke.
          release_identity_floor="d74d31732545769af5d4a3fda232bd10cdba3800"
          git cat-file -e "${release_identity_floor}^{commit}"
          if ! git merge-base --is-ancestor "$release_identity_floor" "$sha"; then
            echo "Refusing deploy: $sha predates verifiable release identity ($release_identity_floor)" >&2
            exit 4
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate bastion SSH configuration
        shell: bash
        env:
          BASTION_KEY: ${{ secrets.CLOUDRU_BASTION_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$BASTION_KEY" ]] || { echo 'Missing CLOUDRU_BASTION_SSH_KEY' >&2; exit 10; }

      - name: Configure bastion SSH
        shell: bash
        env:
          BASTION_KEY: ${{ secrets.CLOUDRU_BASTION_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$BASTION_KEY" > ~/.ssh/cloudru_bastion
          chmod 600 ~/.ssh/cloudru_bastion
          ssh-keyscan -p 22 -H 176.108.246.251 >> ~/.ssh/known_hosts

      - name: Deploy exact main SHA through restricted bastion
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/cloudru_bastion \
            -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@176.108.246.251 \
            "deploy $RELEASE_SHA"

      - name: Public HTTPS parity smoke
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.CLOUDRU_OFELIYA_URL }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${PUBLIC_URL:-}" ]]; then
            echo 'CLOUDRU_OFELIYA_URL is not configured; refusing to call deployment verified.' >&2
            exit 20
          fi
          case "$PUBLIC_URL" in
            https://*) ;;
            *) echo 'CLOUDRU_OFELIYA_URL must use HTTPS' >&2; exit 20 ;;
          esac

          base="${PUBLIC_URL%/}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            curl --fail --show-error --silent --location --retry 5 --retry-all-errors \
              --max-time 20 "$1"
          }

          fetch "$base/" > "$tmp/index.html"
          fetch "$base/release.json" > "$tmp/release.json"
          fetch "$base/sw.js" > "$tmp/sw.js"
          fetch "$base/runtime-config.js" > "$tmp/runtime-config.js"
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors \
            --max-time 20 -D "$tmp/headers.txt" -o /dev/null "$base/"

          node - "$tmp/release.json" "$RELEASE_SHA" <<'NODE'
          const fs = require('node:fs');
          const [path, expected] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (payload.release !== expected) {
            throw new Error(`release.json mismatch: expected ${expected}, got ${payload.release}`);
          }
          for (const key of ['indexSha256', 'serviceWorkerSha256', 'runtimeConfigSha256']) {
            if (!/^[0-9a-f]{64}$/i.test(String(payload[key] || ''))) {
              throw new Error(`release.json missing valid ${key}`);
            }
          }
          NODE

          release_index_sha="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.indexSha256)" "$tmp/release.json")"
          release_sw_sha="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.serviceWorkerSha256)" "$tmp/release.json")"
          release_runtime_sha="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.runtimeConfigSha256)" "$tmp/release.json")"
          actual_index_sha="$(sha256sum "$tmp/index.html" | awk '{print $1}')"
          actual_sw_sha="$(sha256sum "$tmp/sw.js" | awk '{print $1}')"
          actual_runtime_sha="$(sha256sum "$tmp/runtime-config.js" | awk '{print $1}')"

          [[ "$actual_index_sha" == "$release_index_sha" ]] || { echo 'index.html hash mismatch' >&2; exit 21; }
          [[ "$actual_sw_sha" == "$release_sw_sha" ]] || { echo 'sw.js hash mismatch' >&2; exit 22; }
          [[ "$actual_runtime_sha" == "$release_runtime_sha" ]] || { echo 'runtime-config.js hash mismatch' >&2; exit 23; }
          grep -Fq "ofeliya-$RELEASE_SHA" "$tmp/sw.js" || { echo 'sw.js release mismatch' >&2; exit 24; }
          grep -Fq "ofeliya-$RELEASE_SHA" "$tmp/runtime-config.js" || { echo 'runtime-config release mismatch' >&2; exit 25; }

          grep -iq '^content-security-policy:.*https://st.max.ru' "$tmp/headers.txt" || { echo 'MAX CSP missing' >&2; exit 26; }
          grep -iq '^content-security-policy:.*frame-ancestors.*https://.*max.ru' "$tmp/headers.txt" || { echo 'MAX frame-ancestors missing' >&2; exit 27; }
          grep -iq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' "$tmp/headers.txt" || { echo 'Referrer-Policy missing' >&2; exit 28; }
          grep -iq '^permissions-policy:.*camera=().*microphone=()' "$tmp/headers.txt" || { echo 'Permissions-Policy missing' >&2; exit 29; }
          grep -iq '^strict-transport-security:.*max-age=' "$tmp/headers.txt" || { echo 'HSTS missing' >&2; exit 30; }

          printf 'Cloud.ru public parity passed for %s at %s\n' "$RELEASE_SHA" "$PUBLIC_URL"
