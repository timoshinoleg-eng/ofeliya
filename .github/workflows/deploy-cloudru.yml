name: Deploy Cloud.ru production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Full 40-character main commit SHA. Empty = current main.'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ofeliya-cloudru-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: cloudru-production
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve immutable release SHA
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --prune origin main
          sha="${REQUESTED_SHA:-}"
          if [[ -z "$sha" ]]; then
            sha="$(git rev-parse origin/main)"
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character SHA" >&2
            exit 2
          fi
          git cat-file -e "${sha}^{commit}"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Refusing deploy: $sha is not contained in origin/main" >&2
            exit 3
          fi
          # Public SHA verification was introduced by this main commit. Older releases do not
          # expose release.json, so accepting them here would deploy first and only then fail smoke.
          release_identity_floor="d74d31732545769af5d4a3fda232bd10cdba3800"
          git cat-file -e "${release_identity_floor}^{commit}"
          if ! git merge-base --is-ancestor "$release_identity_floor" "$sha"; then
            echo "Refusing deploy: $sha predates verifiable release identity ($release_identity_floor)" >&2
            exit 4
          fi
          bash deploy/check-compatible-release.sh "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for selected SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          runs_file="$(mktemp)"
          trap 'rm -f "$runs_file"' EXIT
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" \
            -f branch=main \
            -f event=push \
            -f status=completed \
            -f per_page=100 > "$runs_file"
          node - "$RELEASE_SHA" "$runs_file" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const expected = process.argv[2];
          const runs = Array.isArray(data.workflow_runs) ? data.workflow_runs : [];
          const match = runs.find(
            (run) =>
              run.name === 'CI' &&
              run.head_sha === expected &&
              run.head_branch === 'main' &&
              run.event === 'push' &&
              run.conclusion === 'success'
          );
          if (!match) {
            const candidates = runs
              .filter((run) => run.head_sha === expected)
              .slice(0, 5)
              .map(({ run_number, name, head_sha, head_branch, event, status, conclusion }) =>
                ({ run_number, name, head_sha, head_branch, event, status, conclusion })
              );
            console.error(
              `CI lookup returned ${runs.length} runs (API total: ${data.total_count ?? 'unknown'}); ` +
              `same-SHA candidates (up to 5): ${JSON.stringify(candidates)}`
            );
            console.error(`Refusing deploy: no successful main CI run found for ${expected}`);
            process.exit(1);
          }
          console.log(`Verified green CI run #${match.run_number} for ${expected}`);
          NODE

      - name: Validate bastion SSH configuration
        shell: bash
        env:
          BASTION_KEY: ${{ secrets.CLOUDRU_BASTION_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$BASTION_KEY" ]] || { echo 'Missing CLOUDRU_BASTION_SSH_KEY' >&2; exit 10; }

      - name: Configure bastion SSH
        shell: bash
        env:
          BASTION_KEY: ${{ secrets.CLOUDRU_BASTION_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$BASTION_KEY" > ~/.ssh/cloudru_bastion
          chmod 600 ~/.ssh/cloudru_bastion
          ssh-keyscan -p 22 -H 176.108.246.251 >> ~/.ssh/known_hosts

      - name: Capture current production release for rollback
        id: previous
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.CLOUDRU_OFELIYA_URL }}
        run: |
          set -Eeuo pipefail
          [[ "${PUBLIC_URL:-}" == https://* ]] || {
            echo 'CLOUDRU_OFELIYA_URL must be configured as HTTPS before deployment' >&2
            exit 20
          }
          release_url="${PUBLIC_URL%/}/release.json"
          payload="$(curl --fail --show-error --silent --location --retry 5 --retry-all-errors             --max-time 20 "$release_url")"
          previous="$(PAYLOAD="$payload" node - <<'NODE'
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const release = String(payload.release || '').trim();
          if (!/^[0-9a-f]{40}$/i.test(release)) process.exit(2);
          process.stdout.write(release.toLowerCase());
          NODE
          )"
          [[ "$previous" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Cannot establish rollback release from $release_url" >&2
            exit 21
          }
          # Refuse rollout BEFORE it can strand Telegram without a safe rollback.
          bash deploy/check-compatible-release.sh "$previous"
          echo "sha=$previous" >> "$GITHUB_OUTPUT"
          printf 'Rollback target captured: %s\n' "$previous"

      - name: Deploy exact main SHA through restricted bastion
        id: rollout
        continue-on-error: true
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/cloudru_bastion \
            -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@176.108.246.251 \
            "deploy $RELEASE_SHA"

      - name: Public HTTPS parity smoke
        id: verify
        if: steps.rollout.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.CLOUDRU_OFELIYA_URL }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${PUBLIC_URL:-}" ]]; then
            echo 'CLOUDRU_OFELIYA_URL is not configured; refusing to call deployment verified.' >&2
            exit 20
          fi
          case "$PUBLIC_URL" in
            https://*) ;;
            *) echo 'CLOUDRU_OFELIYA_URL must use HTTPS' >&2; exit 20 ;;
          esac

          base="${PUBLIC_URL%/}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            curl --fail --show-error --silent --location --retry 5 --retry-all-errors \
              --max-time 20 "$1"
          }

          fetch "$base/" > "$tmp/index.html"
          fetch "$base/release.json" > "$tmp/release.json"
          fetch "$base/sw.js" > "$tmp/sw.js"
          fetch "$base/runtime-config.js" > "$tmp/runtime-config.js"
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors \
            --max-time 20 -D "$tmp/headers.txt" -o /dev/null "$base/"

          node - "$tmp/release.json" "$RELEASE_SHA" <<'NODE'
          const fs = require('node:fs');
          const [path, expected] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (payload.release !== expected) {
            throw new Error(`release.json mismatch: expected ${expected}, got ${payload.release}`);
          }
          for (const key of ['indexSha256', 'serviceWorkerSha256', 'runtimeConfigSha256']) {
            if (!/^[0-9a-f]{64}$/i.test(String(payload[key] || ''))) {
              throw new Error(`release.json missing valid ${key}`);
            }
          }
          NODE

          release_index_sha="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.indexSha256)" "$tmp/release.json")"
          release_sw_sha="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.serviceWorkerSha256)" "$tmp/release.json")"
          release_runtime_sha="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.runtimeConfigSha256)" "$tmp/release.json")"
          actual_index_sha="$(sha256sum "$tmp/index.html" | awk '{print $1}')"
          actual_sw_sha="$(sha256sum "$tmp/sw.js" | awk '{print $1}')"
          actual_runtime_sha="$(sha256sum "$tmp/runtime-config.js" | awk '{print $1}')"

          [[ "$actual_index_sha" == "$release_index_sha" ]] || { echo 'index.html hash mismatch' >&2; exit 21; }
          [[ "$actual_sw_sha" == "$release_sw_sha" ]] || { echo 'sw.js hash mismatch' >&2; exit 22; }
          [[ "$actual_runtime_sha" == "$release_runtime_sha" ]] || { echo 'runtime-config.js hash mismatch' >&2; exit 23; }
          grep -Fq "ofeliya-$RELEASE_SHA" "$tmp/sw.js" || { echo 'sw.js release mismatch' >&2; exit 24; }
          grep -Fq "ofeliya-$RELEASE_SHA" "$tmp/runtime-config.js" || { echo 'runtime-config release mismatch' >&2; exit 25; }

          grep -iq '^content-security-policy:.*https://st.max.ru' "$tmp/headers.txt" || { echo 'MAX CSP missing' >&2; exit 26; }
          grep -iq '^content-security-policy:.*frame-ancestors.*https://.*max.ru' "$tmp/headers.txt" || { echo 'MAX frame-ancestors missing' >&2; exit 27; }
          grep -iq '^content-security-policy:.*https://telegram.org' "$tmp/headers.txt" || { echo 'Telegram SDK CSP missing' >&2; exit 31; }
          grep -iq '^content-security-policy:.*frame-ancestors.*https://web.telegram.org' "$tmp/headers.txt" || { echo 'Telegram frame-ancestors missing' >&2; exit 32; }
          grep -iq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' "$tmp/headers.txt" || { echo 'Referrer-Policy missing' >&2; exit 28; }
          grep -iq '^permissions-policy:.*camera=().*microphone=()' "$tmp/headers.txt" || { echo 'Permissions-Policy missing' >&2; exit 29; }
          grep -iq '^strict-transport-security:.*max-age=' "$tmp/headers.txt" || { echo 'HSTS missing' >&2; exit 30; }

          printf 'Cloud.ru public parity passed for %s at %s\n' "$RELEASE_SHA" "$PUBLIC_URL"

      - name: Roll back failed release
        if: steps.rollout.outcome == 'failure' || steps.verify.outcome == 'failure'
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Rollback SHA is invalid; refusing an ambiguous rollback' >&2
            exit 31
          }
          bash deploy/check-compatible-release.sh "$PREVIOUS_SHA"
          echo "Release failed; restoring $PREVIOUS_SHA"
          ssh -i ~/.ssh/cloudru_bastion             -p 22             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             ubuntu@176.108.246.251             "deploy $PREVIOUS_SHA"

      - name: Verify rollback release
        if: steps.rollout.outcome == 'failure' || steps.verify.outcome == 'failure'
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.CLOUDRU_OFELIYA_URL }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          set -Eeuo pipefail
          release_url="${PUBLIC_URL%/}/release.json"
          for attempt in $(seq 1 8); do
            payload="$(curl --fail --show-error --silent --location --max-time 20 "$release_url" || true)"
            actual="$(PAYLOAD="$payload" node -e "try{const p=JSON.parse(process.env.PAYLOAD||'{}');process.stdout.write(String(p.release||''))}catch{}")"
            if [[ "$actual" == "$PREVIOUS_SHA" ]]; then
              printf 'Rollback verified at %s: %s\n' "$release_url" "$PREVIOUS_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "Rollback verification failed: expected $PREVIOUS_SHA at $release_url" >&2
          exit 32

      - name: Fail deployment after rollback
        if: steps.rollout.outcome == 'failure' || steps.verify.outcome == 'failure'
        shell: bash
        run: |
          echo 'Deployment failed and rollback path was executed; keeping workflow red.' >&2
          exit 1
