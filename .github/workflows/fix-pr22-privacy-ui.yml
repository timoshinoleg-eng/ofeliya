name: Fix PR22 privacy UI

on:
  push:
    branches:
      - fix/viral-privacy-followups

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pr22-ui-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/viral-privacy-followups
      - name: Remove raw friend id from result UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/scenes/UIScene.ts')
          s = p.read_text()
          old = """          const last = f.uid.length > 4 ? '···' + f.uid.slice(-4) : f.uid;\n          return `${f.win ? '🏆' : '⏱'} ${last}  ${fmtTime(f.timeMs)} · ${f.kills}  (${rel})`;"""
          new = """          const mark = f.platform === 'telegram' ? '✈' : f.platform === 'max' ? '✉' : f.platform === 'vk' ? '📱' : '🖥';\n          return `${f.win ? '🏆' : '⏱'} ${mark}  ${fmtTime(f.timeMs)} · ${f.kills}  (${rel})`;"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one UI anchor, got {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/UIScene.ts
          git commit -m "fix: remove raw friend uid from result UI [pr22-ui-fixed]"
          git push origin HEAD:fix/viral-privacy-followups
