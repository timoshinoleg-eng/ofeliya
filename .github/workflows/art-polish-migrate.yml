name: Force synchronous tutorial dismissal

on:
  push:
    branches: [feat/strain-zero-redesign]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, '[art-polish]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strain-zero-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make mutation transition synchronous
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scenes/GameScene.ts')
          s = p.read_text()
          old = "      this.dismissIntroHint();\n      this.pendingChoices = rollRunChoices(st);"
          new = "      this.dismissIntroHint(true);\n      this.pendingChoices = rollRunChoices(st);"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one progression dismissal, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scenes/GameScene.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: destroy onboarding before pausing for mutation'
          git push origin HEAD:feat/strain-zero-redesign
