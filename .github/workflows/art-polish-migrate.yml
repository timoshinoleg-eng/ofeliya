name: Apply tutorial lifecycle P0

on:
  push:
    branches: [feat/strain-zero-redesign]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, '[art-polish]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strain-zero-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply tutorial lifecycle fix
        run: |
          printf '%s' '' | base64 -d > /tmp/tutorial_p0.py
          python /tmp/tutorial_p0.py
      - run: npm ci
      - run: npm run build
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scenes/GameScene.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: dismiss onboarding before mutation UI'
          git push origin HEAD:feat/strain-zero-redesign
