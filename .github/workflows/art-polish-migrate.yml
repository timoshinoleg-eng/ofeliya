name: Apply final Strain Zero art P0 fixes

on:
  push:
    branches: [feat/strain-zero-redesign]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ contains(github.event.head_commit.message, '[art-polish]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strain-zero-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply P0 art lifecycle corrections
        run: |
          printf '%s' '' | base64 -d > /tmp/p0.py
          python /tmp/p0.py
      - run: npm ci
      - run: npm run build
      - name: Commit P0 source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scenes/GameScene.ts src/systems/HostCellSystem.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finish Strain Zero art P0 lifecycle'
          git push origin HEAD:feat/strain-zero-redesign
