name: One-time record contract patch

on:
  push:
    branches:
      - feat/visual-engagement-sprint-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[record-contract-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-engagement-sprint-v1
          fetch-depth: 0

      - name: Pass explicit outcome to SaveSystem
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/scenes/GameScene.ts')
          text = path.read_text()
          old = 'const records = SaveSystem.recordRun(st.timeMs, st.kills, st.level, evolutions);'
          new = 'const records = SaveSystem.recordRun(win, st.timeMs, st.kills, st.level, evolutions);'
          if old not in text:
              print('record contract already patched')
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scenes/GameScene.ts
          git commit -m 'fix: pass explicit run outcome to records [record-contract-patched]'
          git push origin HEAD:feat/visual-engagement-sprint-v1
