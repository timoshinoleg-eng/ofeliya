<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OFELIYA: STRAIN ZERO" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <title>OFELIYA: STRAIN ZERO</title>
    <!-- Must run before MAX Bridge/app boot so each release gets a distinct WebView URL. -->
    <script src="./runtime-config.js"></script>
    <!-- MAX Bridge. Platform detection is late-safe, so a slow CDN cannot permanently demote MAX to browser mode. -->
    <script src="https://st.max.ru/js/max-web-app.js" defer></script>
    <style>
      @font-face {
        font-family: 'Chakra Petch';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/chakra-petch-1.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Chakra Petch';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('fonts/chakra-petch-2.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #12070d;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100dvh;
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
        background: #12070d;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ff78c8;
        background: #12070d;
        font-family: 'Chakra Petch', Arial, sans-serif;
        font-size: 18px;
        letter-spacing: 3px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="splash">OFELIYA · STRAIN ZERO</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
